name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore: ['tools/**', '.github/workflows/probe.yml', '.github/workflows/episodes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk animes-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: animes-tv
          path: animes-tv.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Animes TV v${{ github.run_number }}
          files: animes-tv.apk
          make_latest: true
