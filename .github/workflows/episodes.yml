name: Atualizar episódios
on:
  # Horários em UTC (Brasília = UTC-3). A cada 1 hora:
  #   segunda a sexta, das 15h às 23h; sábado e domingo, o dia todo.
  schedule:
    - cron: "23 18-23 * * 1-5"   # seg–sex, 15h–20h
    - cron: "23 0-2 * * 2-6"     # seg–sex, 21h–23h
    - cron: "23 3-23 * * 6"      # sábado, 00h–20h
    - cron: "23 * * * 0"         # sábado 21h até domingo 20h
    - cron: "23 0-2 * * 1"       # domingo, 21h–23h
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/episodes.py, .github/workflows/episodes.yml]
permissions:
  contents: write
concurrency: episodes
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lista anterior
        run: git fetch --depth=1 origin data && git show FETCH_HEAD:episodes.json > prev.json || echo '{}' > prev.json
      - run: python3 tools/episodes.py
      - run: |
          git config user.name "animes-tv bot"; git config user.email "bot@users.noreply.github.com"
          mv episodes.json /tmp/episodes.json
          git fetch origin data || true
          git checkout -B data origin/data 2>/dev/null || git checkout --orphan data
          git rm -rfq . 2>/dev/null || true
          cp /tmp/episodes.json episodes.json
          git add episodes.json
          git commit -qm "Episódios atualizados" || exit 0
          git push -f origin data
